---
name: Rebase HeroDevs Branch On Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: rebase-herodevs-on-upstream
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase herodevs on upstream master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout herodevs branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: herodevs
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN_INFRA_AUTOMATION }}
          role-session-name: github_rebase_infra_fork_terraform_config_inspect
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get herodevs-automation app info
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2
        with:
          secret-ids: |
            , ${{ vars.GH_APP_AWS_SECRET_HERODEVS_AUTOMATION }}
          name-transformation: none
          parse-json-secrets: true

      - name: Create herodevs-automation token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app_token
        with:
          app-id: ${{ env.app_id }}
          private-key: ${{ env.private_key }}
          owner: herodevs
          repositories: infra-fork-terraform-config-inspect

      - name: Rebase and push
        env:
          GH_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "herodevs-automation[bot]"
          git config user.email "herodevs-automation[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/terraform-docs/terraform-config-inspect.git
          git fetch upstream master

          git checkout herodevs
          git rebase upstream/master

          if git diff --quiet origin/herodevs..HEAD; then
            echo "herodevs is already current with upstream master."
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GH_APP_TOKEN}@github.com/herodevs/infra-fork-terraform-config-inspect.git"
          git push origin HEAD:herodevs --force-with-lease
